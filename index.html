<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Test</title>
</head>
<body>
    <header>

        <h1>This is the main title</h1>
        <h2>This is a sub header</h2>
        <h6>This is a sub header in H6</h6>
    </header>
    <main>
        <!-- Images require a src (source) attribute wich tells the browser where the image is,
         and a alt attribute that describes the image for search engines and screen readers-->
        <img width="40%" src="images/img_circle.JPG" alt="Circle image">
    </main>
    <footer>
        <!-- the & character and its entity reference allow you to enter special characters -->
        &copy; 2026 - All rights reserved
    </footer>
</body>
</html>
